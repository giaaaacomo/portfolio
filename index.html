<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>giaaaacomo.portfolio</title>
  <link rel="stylesheet" href="css.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <script src="projects-data.js"></script>
  <script src="case-studies-data.js"></script>
  <script src="case-study-renderer.js"></script>
  <script src="site-meta.js"></script>
  <script>
  

    const projectList = window.projectsData;
    const projects = Object.fromEntries(projectList.map(project => [project.slug, project]));
    const homeSlots = ["d1", "d2", "e1", "e2", "f1", "f2", "g1", "g2", "h1", "h2"];

    const imagePreloadCache = new Map();

    function getProjectImageUrl(imageName, projectTitle = "") {
      return window.projectUtils.getProjectImageUrl(imageName, projectTitle);
    }

    function preloadImage(imageName, projectTitle = "") {
      const imageUrl = getProjectImageUrl(imageName, projectTitle);
      if (imagePreloadCache.has(imageUrl)) {
        return imagePreloadCache.get(imageUrl);
      }

      const image = new Image();
      image.decoding = "async";

      const preload = new Promise((resolve) => {
        image.onload = function () {
          resolve(true);
        };
        image.onerror = function () {
          resolve(false);
        };
      });

      image.src = imageUrl;
      imagePreloadCache.set(imageUrl, preload);
      return preload;
    }

    function preloadProjectImages(project) {
      project.images.forEach((imageName) => preloadImage(imageName, project.title));
    }

    function preloadAllProjectImages() {
      const firstImages = projectList.map(project => [project.images[0], project.title]);
      const remainingImages = projectList.flatMap(project => project.images.slice(1).map((imageName) => [imageName, project.title]));

      firstImages.forEach(([imageName, projectTitle]) => preloadImage(imageName, projectTitle));

      const preloadRemainingImages = function () {
        remainingImages.forEach(([imageName, projectTitle]) => preloadImage(imageName, projectTitle));
      };

      if ("requestIdleCallback" in window) {
        requestIdleCallback(preloadRemainingImages);
      } else {
        setTimeout(preloadRemainingImages, 500);
      }
    }

    preloadAllProjectImages();

    document.addEventListener("DOMContentLoaded", function () {
      const homeContainer = document.querySelector(".contenitore");
      const imageContainer = document.querySelector(".image");
      const fileContainer = document.querySelector(".file");
      const fileImage = document.querySelector(".image-file");
      const fileImageLayers = document.querySelectorAll(".file-image-layer");
      const fileTitle = document.querySelector(".title-file");
      const fileText = document.querySelector(".text-file");
      const fileContent = document.querySelector(".file-content");
      const fileContentText = document.querySelector(".file-content-div-text");
      const fileProjectMeta = document.querySelector(".file-project-meta");
      const fileFooterLink = document.querySelector(".file-footer-link");
      const inlineCaseStudyRoot = document.querySelector("[data-inline-case-study-root]");
      const fileClose = document.querySelector(".file-close-svg");
      let currentProject = null;
      let currentImageIndex = 0;
      let activeImageLayerIndex = 0;
      let slideshowRequestId = 0;

      function resetProjectScroll() {
        [fileContainer, fileContent, fileContentText, fileText].forEach((element) => {
          if (!element) {
            return;
          }

          element.scrollTop = 0;
          element.scrollLeft = 0;

          if (typeof element.scrollTo === "function") {
            element.scrollTo(0, 0);
          }
        });
      }

      function resetProjectScrollAfterLayout() {
        resetProjectScroll();
        window.requestAnimationFrame(() => {
          resetProjectScroll();
          window.requestAnimationFrame(resetProjectScroll);
        });
        window.setTimeout(resetProjectScroll, 0);
        window.setTimeout(resetProjectScroll, 80);
      }

      function syncProjectFooterLink(project) {
        fileFooterLink.innerHTML = "";
        fileFooterLink.classList.remove("has-footer-content");
        fileContentText.classList.remove("has-project-links", "has-no-project-links");

        const caseStudyLink = window.projectUtils.getProjectCaseStudyLink(project);
        const projectLinks = window.projectUtils.getProjectLinks(project);
        if (!caseStudyLink && projectLinks.length === 0) {
          fileContentText.classList.add("has-no-project-links");
          return;
        }

        fileContentText.classList.add("has-project-links");

        if (caseStudyLink) {
          const caseStudyElement = document.createElement("a");
          caseStudyElement.className = "file-footer-anchor file-case-study-anchor";
          caseStudyElement.href = caseStudyLink.href;
          caseStudyElement.dataset.caseStudy = caseStudyLink.caseStudy;
          caseStudyElement.textContent = caseStudyLink.label;
          fileFooterLink.appendChild(caseStudyElement);
        }

        projectLinks.forEach((link) => {
          const linkElement = link.href ? document.createElement("a") : document.createElement("span");
          linkElement.className = "file-footer-anchor external-link";

          if (link.wip) {
            linkElement.classList.add("is-wip");
          }

          const linkLabel = document.createElement("span");
          linkLabel.className = "external-link-label";
          linkLabel.textContent = link.label;
          linkElement.appendChild(linkLabel);

          if (link.wip) {
            const wipLabel = document.createElement("span");
            wipLabel.className = "external-link-wip";
            wipLabel.textContent = "(WIP)";
            linkElement.appendChild(wipLabel);
          }

          if (link.href) {
            linkElement.href = link.href;
            linkElement.target = "_blank";
            linkElement.rel = "noreferrer";
          } else {
            linkElement.classList.add("file-footer-label");
          }

          fileFooterLink.appendChild(linkElement);
        });

        fileFooterLink.classList.add("has-footer-content");
      }

      function syncProjectMeta(project) {
        fileProjectMeta.innerHTML = "";
        const metaEntries = [
          ["CATEGORY", project.category],
          ["CLIENT", project.client],
          ["YEAR", project.year]
        ].filter(([, value]) => Boolean(value));

        if (metaEntries.length === 0) {
          fileProjectMeta.classList.remove("has-project-meta");
          return;
        }

        metaEntries.forEach(([label, value]) => {
          const metaEntry = document.createElement("div");
          metaEntry.className = "file-project-meta-entry";

          const metaLabel = document.createElement("span");
          metaLabel.className = "file-project-meta-label";
          metaLabel.textContent = label;

          const metaItem = document.createElement("span");
          metaItem.className = "file-project-meta-item";
          metaItem.textContent = value;

          metaEntry.append(metaLabel, metaItem);
          fileProjectMeta.appendChild(metaEntry);
        });

        fileProjectMeta.classList.add("has-project-meta");
      }

      function renderHomeProjects() {
        window.projectUtils.validateProjectData();

        const featuredProjects = window.projectUtils.getFeaturedProjects();
        const homeLoading = homeContainer.querySelector("[data-home-loading]");
        if (featuredProjects.length > homeSlots.length) {
          console.error(`Too many featured projects: ${featuredProjects.length}. Only ${homeSlots.length} home slots are available.`);
        }

        const projectsToRender = featuredProjects.slice(0, homeSlots.length);

        projectsToRender.forEach((project, projectIndex) => {
          const homeSlot = homeSlots[projectIndex];
          const title = document.createElement("div");
          title.className = "cella tit";
          title.id = homeSlot;
          title.dataset.project = project.slug;
          title.textContent = project.title;
          homeContainer.insertBefore(title, document.getElementById("k12"));
        });

        if (homeLoading) {
          homeLoading.remove();
        }
      }

      function fitHomeTitles() {
        const minSharedScale = 0.64;
        const minCondense = 0.88;
        const horizontalBreathingRoom = 32;
        const titles = Array.from(document.querySelectorAll(".tit[data-project]"));
        if (titles.length === 0) {
          return;
        }

        titles.forEach((title) => {
          title.style.fontSize = "";
          title.style.setProperty("--title-condense", "1");
        });

        const baseFontSize = parseFloat(window.getComputedStyle(titles[0]).fontSize);
        let sharedScale = 1;
        const measureCanvas = fitHomeTitles.measureCanvas || document.createElement("canvas");
        const measureContext = measureCanvas.getContext("2d");
        fitHomeTitles.measureCanvas = measureCanvas;

        function getTitleTextWidth(title, fontSize = baseFontSize) {
          const style = window.getComputedStyle(title);
          measureContext.font = `${style.fontStyle} ${style.fontVariant} ${style.fontWeight} ${fontSize}px ${style.fontFamily}`;
          return measureContext.measureText(title.textContent).width;
        }

        titles.forEach((title) => {
          const availableWidth = Math.max(
            title.clientWidth - horizontalBreathingRoom,
            title.clientWidth * 0.88
          );
          const textWidth = getTitleTextWidth(title);

          const requiredCondense = availableWidth / textWidth;
          if (requiredCondense >= minCondense) {
            return;
          }

          sharedScale = Math.min(sharedScale, Math.max(requiredCondense / minCondense, minSharedScale));
        });

        if (sharedScale < 1) {
          titles.forEach((title) => {
            title.style.fontSize = `${baseFontSize * sharedScale}px`;
          });
        }

        titles.forEach((title) => {
          const scaledFontSize = baseFontSize * sharedScale;
          const availableWidth = Math.max(
            title.clientWidth - horizontalBreathingRoom,
            title.clientWidth * 0.88
          );
          const textWidth = getTitleTextWidth(title, scaledFontSize);
          const condense = Math.max(Math.min(availableWidth / textWidth, 1), minCondense);
          title.style.setProperty("--title-condense", String(condense));
        });

        titles.forEach((title) => {
          const scaledFontSize = baseFontSize * sharedScale;
          const visualWidth = getTitleTextWidth(title, scaledFontSize) * parseFloat(title.style.getPropertyValue("--title-condense") || "1");
          if (visualWidth > title.clientWidth + 1) {
            console.warn(`Title "${title.textContent}" still overflows after title fitting.`);
          }
        });
      }

      function requestHomeTitleFit() {
        fitHomeTitles();
        requestAnimationFrame(fitHomeTitles);
        window.setTimeout(fitHomeTitles, 80);
      }

      function getProjectFromTitle(title) {
        return projects[title.dataset.project];
      }

      function showProjectImage(project, imageIndex, instant = false) {
        const imageUrl = getProjectImageUrl(project.images[imageIndex], project.title);
        const nextLayerIndex = instant ? activeImageLayerIndex : 1 - activeImageLayerIndex;
        const nextLayer = fileImageLayers[nextLayerIndex];
        const currentLayer = fileImageLayers[activeImageLayerIndex];

        function revealImage() {
          nextLayer.classList.add("is-visible");
          if (nextLayer !== currentLayer) {
            currentLayer.classList.remove("is-visible");
          }
          activeImageLayerIndex = nextLayerIndex;
        }

        nextLayer.src = imageUrl;

        if (instant || nextLayer.complete) {
          revealImage();
          return Promise.resolve(true);
        }

        return new Promise((resolve) => {
          nextLayer.onload = function () {
            if (nextLayer.decode) {
              nextLayer.decode().catch(() => null).then(() => {
                revealImage();
                resolve(true);
              });
            } else {
              revealImage();
              resolve(true);
            }
          };
          nextLayer.onerror = function () {
            resolve(false);
          };
        });
      }

      function showProjectPreview(title) {
        const project = getProjectFromTitle(title);
        if (!project) {
          return;
        }

        imageContainer.style.backgroundImage = `url("${getProjectImageUrl(project.images[0], project.title)}")`;
        imageContainer.style.display = "block";
      }

      function hideProjectPreview() {
        imageContainer.style.display = "none";
      }

      function openProject(title) {
        const project = getProjectFromTitle(title);
        if (!project) {
          return;
        }

        fileContainer.classList.remove("is-case-study");
        inlineCaseStudyRoot.innerHTML = "";
        currentProject = project;
        currentImageIndex = 0;
        const requestId = slideshowRequestId + 1;
        slideshowRequestId = requestId;
        preloadProjectImages(currentProject);

        fileTitle.textContent = currentProject.title;
        fileText.innerHTML = currentProject.text;
        syncProjectMeta(currentProject);
        syncProjectFooterLink(currentProject);
        resetProjectScrollAfterLayout();

        preloadImage(currentProject.images[0], currentProject.title).then(() => {
          if (currentProject !== project || slideshowRequestId !== requestId) {
            return;
          }

          showProjectImage(currentProject, currentImageIndex, true).then(() => {
            if (currentProject === project && slideshowRequestId === requestId) {
              document.body.classList.add("is-project-open");
              fileContainer.style.display = "block";
              resetProjectScrollAfterLayout();
            }
          });
        });
      }

      function openCaseStudy(caseStudySlug) {
        if (!caseStudySlug || !window.caseStudyRenderer) {
          return;
        }

        currentProject = null;
        slideshowRequestId += 1;
        fileContainer.classList.add("is-case-study");
        fileContainer.style.display = "block";
        document.body.classList.add("is-project-open");
        window.caseStudyRenderer.renderInto(inlineCaseStudyRoot, caseStudySlug, { mode: "inline" });
        resetProjectScrollAfterLayout();
      }

      function closeProject() {
        window.caseStudyRenderer?.closeImageLightbox?.();
        fileContainer.style.display = "none";
        resetProjectScrollAfterLayout();
        currentProject = null;
        slideshowRequestId += 1;
        document.body.classList.remove("is-project-open");
        fileContainer.classList.remove("is-case-study");
        inlineCaseStudyRoot.innerHTML = "";
      }

      renderHomeProjects();
      requestHomeTitleFit();

      if (document.fonts) {
        document.fonts.ready.then(requestHomeTitleFit);
      }

      document.querySelectorAll(".tit").forEach((title) => {
        title.addEventListener("mouseenter", function () {
          showProjectPreview(title);
        });
        title.addEventListener("mouseleave", hideProjectPreview);
        title.addEventListener("click", function () {
          openProject(title);
        });
      });

      fileClose.addEventListener("click", closeProject);

      fileFooterLink.addEventListener("click", function (event) {
        const caseStudyLink = event.target.closest("[data-case-study]");
        if (!caseStudyLink) {
          return;
        }

        event.preventDefault();
        openCaseStudy(caseStudyLink.dataset.caseStudy);
      });

      window.addEventListener('mouseup', function (event) {
        if (event.target.closest("[data-case-study-lightbox]")) {
          return;
        }

        if (!(event.target.closest(".file"))) {
          closeProject();
        }
      });

      function changeImage() {
        if (window.getComputedStyle(fileContainer).display === "none" || !currentProject || currentProject.images.length <= 1) {
          return;
        }

        const project = currentProject;
        const nextImageIndex = (currentImageIndex + 1) % project.images.length;
        const requestId = slideshowRequestId + 1;
        slideshowRequestId = requestId;

        preloadImage(project.images[nextImageIndex], project.title).then((loaded) => {
          if (!loaded || currentProject !== project || slideshowRequestId !== requestId) {
            return;
          }

          showProjectImage(project, nextImageIndex).then((shown) => {
            if (!shown || currentProject !== project || slideshowRequestId !== requestId) {
              return;
            }

            currentImageIndex = nextImageIndex;
          });
        });
      }
      setInterval(changeImage, 2500); //ogni 5 secondi

      window.addEventListener("resize", requestHomeTitleFit);
    });


  </script>
